[project]
name = "comfyui-applesilicon-int8-fast"
description = "Fast int8, fp8 and NVFP4 diffusion models in ComfyUI on Apple Silicon: Metal int8 matmul, flash and sparse attention, and fused kernels for Krea 2, MiniMax H3 and LTX 2.5, plus fixes that let quantized models run on MPS."
version = "1.1.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
mlx = ["mlx-vlm"]
# Build toolchain for the ObjC++ Metal matmul kernels (fp8-native #3/#20, int4
# #22). These are DEFAULT ON but gated on M5/Metal-4.1 AND the presence of `ninja`
# (torch's cpp_extension needs it to build). Without this extra the kernels simply
# stay inert — nothing breaks — so install [kernels] to unlock them on an M5:
#   pip install "comfyui-applesilicon-int8-fast[kernels]"
kernels = ["ninja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--import-mode=importlib"

[tool.comfy]
DisplayName = "ComfyUI-AppleSilicon-int8-Fast"
Icon = "icon.svg"
